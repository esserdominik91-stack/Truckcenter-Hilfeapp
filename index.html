<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>TruckShop Hilfe App</title>
  <style>
    :root{
      --bg: #f6f8fb;
      --card: #ffffff;
      --text: #0f172a;
      --muted: #64748b;
      --border: #e5e7eb;

      /* Helle Blau-Akzente */
      --accent: #2563eb;           /* blau */
      --accentSoft: #eff6ff;       /* sehr hell blau */
      --accentSoft2:#dbeafe;       /* hellblau */
      --accentBorder: rgba(37,99,235,.28);

      --shadow: 0 10px 30px rgba(2,6,23,.08);
      --shadow2: 0 6px 18px rgba(2,6,23,.06);
      --ok: #16a34a;

      --radius: 18px;
      --radius2: 22px;
    }
    *{ box-sizing:border-box; }
    body{
      margin:0;
      font-family: system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,"Apple Color Emoji","Segoe UI Emoji";
      color:var(--text);
      background: linear-gradient(180deg, #ffffff 0%, var(--accentSoft) 35%, var(--bg) 100%);
      min-height:100vh;
    }
    .wrap{
      max-width: 1200px;
      margin: 0 auto;
      padding: 18px 16px 40px;
    }

    .topbar{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:12px;
      padding: 10px 0 14px;
    }
    .brand{ display:flex; flex-direction:column; gap:2px; }
    .brand h1{
      margin:0;
      font-size: 26px;
      letter-spacing:-0.02em;
      line-height:1.15;
    }
    .brand small{ color:var(--muted); font-size: 13px; }

    .searchRow{
      width:100%;
      max-width: 520px;
      margin-left:auto;
      display:flex;
      gap:10px;
      align-items:center;
    }
    .searchRow input{
      width:100%;
      padding: 14px 14px;
      border: 1px solid var(--border);
      border-radius: 14px;
      background: #fff;
      font-size: 16px;
      outline:none;
      box-shadow: 0 1px 0 rgba(2,6,23,.03);
    }
    .searchRow input:focus{
      border-color: var(--accentBorder);
      box-shadow: 0 0 0 4px rgba(37,99,235,.12);
    }

    .navline{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:12px;
      margin: 8px 0 14px;
    }
    .crumbs{
      color: var(--muted);
      font-size: 14px;
      line-height:1.4;
      display:flex;
      flex-wrap:wrap;
      gap:8px;
      align-items:center;
    }
    .crumbs span{ display:inline-flex; align-items:center; }
    .crumbs span.clickable{
      cursor:pointer;
      color: var(--accent);
      font-weight:600;
    }
    .crumbs .sep{ opacity:.55; padding:0 6px; }

    .btn{
      border:1px solid var(--border);
      background:#fff;
      padding: 10px 12px;
      border-radius: 14px;
      cursor:pointer;
      font-size:14px;
      color: var(--accent);
      font-weight: 650;
      box-shadow: 0 1px 0 rgba(2,6,23,.03);
      display:inline-flex;
      align-items:center;
      gap:10px;
      user-select:none;
    }
    .btn:hover{
      box-shadow: var(--shadow2);
      transform: translateY(-1px);
      border-color: var(--accentBorder);
      background: linear-gradient(180deg, #fff 0%, var(--accentSoft) 100%);
    }
    .btn:active{ transform: translateY(0px); }

    .grid{
      display:grid;
      grid-template-columns: repeat(3, minmax(0,1fr));
      gap: 16px;
      margin-top: 14px;
    }
    @media (max-width: 980px){ .grid{ grid-template-columns: repeat(2, minmax(0,1fr)); } }
    @media (max-width: 560px){ .grid{ grid-template-columns: repeat(1, minmax(0,1fr)); } }

    .tile{
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius2);
      box-shadow: var(--shadow2);
      padding: 18px 18px;
      min-height: 112px;
      cursor:pointer;
      display:flex;
      flex-direction:column;
      justify-content:center;
      gap:10px;
      transition: transform .12s ease, box-shadow .12s ease, border-color .12s ease;
      position:relative;
      overflow:hidden;
    }
    /* dezenter Akzentstreifen */
    .tile::before{
      content:"";
      position:absolute;
      left:0; top:0; bottom:0;
      width: 6px;
      background: linear-gradient(180deg, rgba(37,99,235,.22), rgba(37,99,235,.08));
      opacity:.9;
    }
    .tile:hover{
      transform: translateY(-2px);
      box-shadow: var(--shadow);
      border-color: var(--accentBorder);
    }
    .tileTop{ display:flex; gap:12px; align-items:center; }
    .emoji{
      width:50px; height:50px;
      border-radius: 16px;
      display:grid;
      place-items:center;
      background: linear-gradient(180deg, var(--accentSoft2) 0%, var(--accentSoft) 100%);
      border: 1px solid rgba(37,99,235,.18);
      font-size: 24px;
      flex: 0 0 auto;
    }
    .tileTitle{ margin:0; font-size: 18px; letter-spacing:-0.01em; }
    .tileMeta{ margin:0; color: var(--muted); font-size: 14px; }

    .topicLayout{
      display:grid;
      grid-template-columns: 1.7fr .9fr;
      gap: 16px;
      align-items:start;
      margin-top: 14px;
    }
    @media (max-width: 980px){ .topicLayout{ grid-template-columns: 1fr; } }

    .panel{
      background:#fff;
      border:1px solid var(--border);
      border-radius: var(--radius);
      box-shadow: var(--shadow2);
      padding: 16px;
    }
    .panel h3{
      margin: 0 0 10px;
      font-size: 16px;
      color: var(--text);
    }
    .panel p{ margin: 6px 0; color: var(--muted); font-size: 14px; }

    .intro{
      background:#fff;
      border:1px solid var(--border);
      border-radius: var(--radius);
      box-shadow: 0 1px 0 rgba(2,6,23,.03);
      padding: 12px;
      margin-bottom: 10px;
      color: var(--text);
      white-space: pre-wrap;
      line-height: 1.45;
    }

    .steps{ display:flex; flex-direction:column; gap: 10px; }
    .step{
      background:#fff;
      border:1px solid var(--border);
      border-radius: var(--radius);
      padding: 12px 12px;
      box-shadow: 0 1px 0 rgba(2,6,23,.03);
      display:flex;
      gap:12px;
      align-items:flex-start;
    }
    .check{
      width: 22px;
      height: 22px;
      border-radius: 7px;
      border: 2px solid rgba(100,116,139,.35);
      margin-top: 2px;
      flex: 0 0 auto;
      cursor:pointer;
      position:relative;
      background:#fff;
    }
    .check.done{
      border-color: rgba(22,163,74,.55);
      background: rgba(22,163,74,.10);
    }
    .check.done::after{
      content:"";
      position:absolute;
      left:6px; top:2px;
      width:6px; height:12px;
      border-right:3px solid var(--ok);
      border-bottom:3px solid var(--ok);
      transform: rotate(40deg);
    }
    .stepText{ display:flex; flex-direction:column; gap:6px; width:100%; }
    .stepText b{ font-size: 15px; line-height:1.3; }
    .stepText .hint{
      color: var(--muted);
      font-size: 14px;
      line-height:1.35;
      white-space: pre-wrap;
    }

    .results{
      margin-top: 12px;
      display:none;
      gap: 10px;
      flex-direction:column;
    }
    .resultItem{
      background:#fff;
      border:1px solid var(--border);
      border-radius: var(--radius);
      padding: 12px 12px;
      box-shadow: 0 1px 0 rgba(2,6,23,.03);
      cursor:pointer;
    }
    .resultItem:hover{ box-shadow: var(--shadow2); border-color: var(--accentBorder); }
    .resultItem .rTitle{ margin:0; font-weight:700; }
    .resultItem .rMeta{ margin:6px 0 0; color: var(--muted); font-size: 13px; }

    .loading{
      background:#fff;
      border:1px solid var(--border);
      border-radius: var(--radius);
      padding: 14px;
      box-shadow: 0 1px 0 rgba(2,6,23,.03);
      color: var(--muted);
      display:flex;
      align-items:center;
      gap:10px;
    }
    .dot{
      width:10px; height:10px; border-radius:50%;
      background: rgba(37,99,235,.35);
      animation: pulse 1s infinite;
    }
    @keyframes pulse{
      0%{ transform: scale(1); opacity:.6; }
      50%{ transform: scale(1.25); opacity:1; }
      100%{ transform: scale(1); opacity:.6; }
    }
  </style>
</head>

<body>
  <div class="wrap">
    <div class="topbar">
      <div class="brand">
        <h1>TruckShop Hilfe App</h1>
        <small>Einfach klicken – Schritt für Schritt.</small>
      </div>

      <!-- Suche nur auf Start -->
      <div class="searchRow" id="searchRow" style="display:none;">
        <input id="searchInput" type="search" placeholder="Suchen (z. B. Strom, Wasser, Pumpe …)" autocomplete="off" />
      </div>
    </div>

    <div class="navline" id="navline" style="display:none;">
      <div class="crumbs" id="crumbs"></div>
      <button class="btn" id="backBtn" type="button">← Zurück</button>
    </div>

    <div id="app">
      <div class="loading"><span class="dot"></span> Inhalte werden geladen …</div>
    </div>
  </div>

<script>
/* ===========================================================
   Sheet-Spalten (von dir):
   kategorie | kategorie_reihenfolge | unterkategorie | reihenfolge
   titel | inhalt | aktiv | schritt1..schritt20
   =========================================================== */

const CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vQCXjTKGowsZ4NrxhRqueZyKaDA5ny-lSAuxNaxhCOmlk_SAmI9WBGCRnY-yeOzKOvNl_DuD4T49EMK/pub?output=csv";

const STORAGE_KEY = "truckshop-hilfe-done-v3";
let doneState = loadDone();

let topics = [];
let state = { level: "start", category: null, subcategory: null, topicId: null };

const appEl = document.getElementById("app");
const searchRowEl = document.getElementById("searchRow");
const searchInputEl = document.getElementById("searchInput");
const navlineEl = document.getElementById("navline");
const crumbsEl = document.getElementById("crumbs");
const backBtn = document.getElementById("backBtn");

const norm = (v) => (v ?? "").toString().trim();
const nlow = (v) => norm(v).toLowerCase();

function loadDone(){
  try { return JSON.parse(localStorage.getItem(STORAGE_KEY) || "{}"); }
  catch { return {}; }
}
function saveDone(){ localStorage.setItem(STORAGE_KEY, JSON.stringify(doneState)); }

async function loadCSV(url){
  const res = await fetch(url, { cache: "no-store" });
  if(!res.ok) throw new Error("CSV konnte nicht geladen werden. Status: " + res.status);
  const text = await res.text();
  return parseCSV(text);
}
function parseCSV(csvText){
  const lines = csvText.replace(/\r/g,"").split("\n").filter(l => l.trim().length);
  if(!lines.length) return [];
  const header = splitCSVLine(lines[0]).map(h => h.trim());
  const out = [];

  for(let i=1;i<lines.length;i++){
    const cols = splitCSVLine(lines[i]);
    const obj = {};
    header.forEach((h, idx) => obj[h] = cols[idx] ?? "");
    out.push(obj);
  }
  return out;
}
function splitCSVLine(line){
  const result = [];
  let cur = "";
  let inQ = false;

  for(let i=0;i<line.length;i++){
    const ch = line[i];
    if(ch === '"'){
      if(inQ && line[i+1] === '"'){ cur += '"'; i++; }
      else inQ = !inQ;
    } else if(ch === "," && !inQ){
      result.push(cur); cur = "";
    } else {
      cur += ch;
    }
  }
  result.push(cur);
  return result;
}

function isActive(v){
  const x = nlow(v);
  if(!x) return true;
  return ["1","true","ja","yes","y","aktiv","x"].includes(x);
}

/* ===========================================================
   Emoji Mapping (Keyword-basiert) + Fallback
   - level: cat | sub | topic
   - Wir prüfen Label + optional Subcategory/Title für bessere Treffer.
   =========================================================== */
const EMOJI_RULES = [
  { keys: ["strom", "elektr", "kabel", "sicherung", "batter", "spannung", "12v", "24v"], e: "⚡" },
  { keys: ["wasser", "pumpe", "tank", "leitung", "hahn", "ventil", "leck", "dicht"], e: "💧" },
  { keys: ["hydraul", "öl", "zylinder", "presse", "kipper"], e: "🛢️" },
  { keys: ["luft", "druck", "kompressor", "pneum", "bremsluft"], e: "💨" },
  { keys: ["brem", "abs", "esp", "belag", "scheibe"], e: "🛑" },
  { keys: ["licht", "lampe", "beleucht", "led", "blinker"], e: "💡" },
  { keys: ["reifen", "rad", "felge", "luftdruck", "profil"], e: "🛞" },
  { keys: ["tür", "klappe", "scharnier", "verschluss", "griff"], e: "🚪" },
  { keys: ["plan", "plane", "spriegel", "aufbau"], e: "🧵" },
  { keys: ["kühl", "kuehl", "temperatur"], e: "❄️" },
  { keys: ["motor", "antrieb", "getriebe"], e: "⚙️" },
  { keys: ["sicherheit", "warn", "gefahr"], e: "⚠️" },
  { keys: ["hilfe", "info", "anleitung", "faq"], e: "🧾" },
  { keys: ["werkzeug", "tool", "schlüssel", "schraube"], e: "🧰" },
  { keys: ["check", "prüfung", "kontrolle", "tüv", "hu"], e: "✅" },
];

const LEVEL_DEFAULT = {
  cat: "📁",
  sub: "🧩",
  topic: "📌"
};

function emojiFor(level, ...texts){
  const hay = texts.map(t => nlow(t)).join(" ");
  for(const rule of EMOJI_RULES){
    if(rule.keys.some(k => hay.includes(k))) return rule.e;
  }
  return LEVEL_DEFAULT[level] || "📄";
}

/* ---------- UI helpers ---------- */
function uniqueBy(arr, fnKey){
  const m = new Map();
  for(const item of arr){
    const k = fnKey(item);
    if(!m.has(k)) m.set(k, item);
  }
  return Array.from(m.values());
}

function renderTiles(items, onClick){
  const grid = document.createElement("div");
  grid.className = "grid";

  items.forEach(it => {
    const tile = document.createElement("div");
    tile.className = "tile";
    tile.onclick = () => onClick(it);

    const top = document.createElement("div");
    top.className = "tileTop";

    const emoji = document.createElement("div");
    emoji.className = "emoji";
    emoji.textContent = it.emoji || "📁";

    const txt = document.createElement("div");
    const h = document.createElement("p");
    h.className = "tileTitle";
    h.textContent = it.title;

    const meta = document.createElement("p");
    meta.className = "tileMeta";
    meta.textContent = it.meta || "";

    txt.appendChild(h);
    txt.appendChild(meta);

    top.appendChild(emoji);
    top.appendChild(txt);

    tile.appendChild(top);
    grid.appendChild(tile);
  });

  return grid;
}

/* ---------- Navigation ---------- */
function setNav(){
  if(state.level === "start"){
    navlineEl.style.display = "none";
    crumbsEl.innerHTML = "";
    return;
  }
  navlineEl.style.display = "flex";

  const parts = [];
  parts.push({label:"Start", level:"start"});
  if(state.category) parts.push({label: state.category, level:"sub"});
  if(state.subcategory) parts.push({label: state.subcategory, level:"topics"});
  if(state.topicId){
    const t = topics.find(x => x.id === state.topicId);
    if(t) parts.push({label: t.title, level:"topic"});
  }

  crumbsEl.innerHTML = "";
  parts.forEach((p, idx) => {
    const span = document.createElement("span");
    const isClickable = (idx < parts.length-1);
    span.textContent = p.label;
    if(isClickable){
      span.className = "clickable";
      span.onclick = () => jumpToLevel(p.level);
    }
    crumbsEl.appendChild(span);
    if(idx < parts.length-1){
      const sep = document.createElement("span");
      sep.className = "sep";
      sep.textContent = "›";
      crumbsEl.appendChild(sep);
    }
  });
}

function jumpToLevel(level){
  if(level === "start"){
    state = { level:"start", category:null, subcategory:null, topicId:null };
  } else if(level === "sub"){
    state = { level:"sub", category: state.category, subcategory:null, topicId:null };
  } else if(level === "topics"){
    state = { level:"topics", category: state.category, subcategory: state.subcategory, topicId:null };
  }
  render();
}

/* ---------- Screens ---------- */
function renderStart(){
  searchRowEl.style.display = "flex";

  const cats = uniqueBy(topics, t => t.category)
    .sort((a,b) => (a.catOrder - b.catOrder) || a.category.localeCompare(b.category))
    .map(t => ({
      title: t.category,
      emoji: emojiFor("cat", t.category),
      meta: "Kategorie auswählen"
    }));

  appEl.innerHTML = "";
  appEl.appendChild(renderTiles(cats, (it) => {
    state.level = "sub";
    state.category = it.title;
    state.subcategory = null;
    state.topicId = null;
    render();
  }));

  const results = document.createElement("div");
  results.className = "results";
  results.id = "results";
  appEl.appendChild(results);

  bindSearch();
}

function renderSubcategories(){
  searchRowEl.style.display = "none";

  const subsRaw = topics.filter(t => t.category === state.category && t.subcategory);
  const subs = uniqueBy(subsRaw, t => t.subcategory)
    .sort((a,b) => (a.subOrder - b.subOrder) || a.subcategory.localeCompare(b.subcategory))
    .map(t => ({
      title: t.subcategory,
      emoji: emojiFor("sub", t.subcategory, state.category),
      meta: "Unterkategorie auswählen"
    }));

  appEl.innerHTML = "";
  appEl.appendChild(renderTiles(subs, (it) => {
    state.level = "topics";
    state.subcategory = it.title;
    state.topicId = null;
    render();
  }));
}

function renderTopics(){
  searchRowEl.style.display = "none";

  const tops = topics
    .filter(t => t.category === state.category && t.subcategory === state.subcategory)
    .sort((a,b) => a.title.localeCompare(b.title))
    .map(t => ({
      id: t.id,
      title: t.title,
      emoji: emojiFor("topic", t.title, t.subcategory, t.category),
      meta: "Thema öffnen"
    }));

  appEl.innerHTML = "";
  appEl.appendChild(renderTiles(tops, (it) => {
    state.level = "topic";
    state.topicId = it.id;
    render();
  }));
}

function renderTopic(){
  searchRowEl.style.display = "none";
  const t = topics.find(x => x.id === state.topicId);
  if(!t){
    appEl.innerHTML = "";
    const box = document.createElement("div");
    box.className = "panel";
    box.innerHTML = `<h3>Hinweis</h3><p>Thema nicht gefunden.</p>`;
    appEl.appendChild(box);
    return;
  }

  const topicKey = t.id;
  const steps = t.steps || [];
  const doneCount = steps.reduce((acc, s, idx) => acc + (doneState[topicKey + "::" + idx] ? 1 : 0), 0);

  appEl.innerHTML = "";

  const layout = document.createElement("div");
  layout.className = "topicLayout";

  const left = document.createElement("div");
  left.className = "steps";

  if(t.content){
    const intro = document.createElement("div");
    intro.className = "intro";
    intro.textContent = t.content;
    left.appendChild(intro);
  }

  steps.forEach((text, idx) => {
    const row = document.createElement("div");
    row.className = "step";

    const box = document.createElement("div");
    box.className = "check" + (doneState[topicKey + "::" + idx] ? " done" : "");
    box.onclick = () => {
      const k = topicKey + "::" + idx;
      doneState[k] = !doneState[k];
      saveDone();
      render();
    };

    const txt = document.createElement("div");
    txt.className = "stepText";

    const title = document.createElement("b");
    title.textContent = "Schritt " + (idx + 1);

    const hint = document.createElement("div");
    hint.className = "hint";
    hint.textContent = text;

    txt.appendChild(title);
    txt.appendChild(hint);

    row.appendChild(box);
    row.appendChild(txt);
    left.appendChild(row);
  });

  const right = document.createElement("div");
  right.className = "panel";

  const h = document.createElement("h3");
  h.textContent = "Fortschritt";
  right.appendChild(h);

  const p1 = document.createElement("p");
  p1.innerHTML = `<b>${doneCount}</b> von <b>${steps.length}</b> Schritten erledigt`;
  right.appendChild(p1);

  const pct = steps.length ? Math.round((doneCount/steps.length)*100) : 0;
  const p2 = document.createElement("p");
  p2.textContent = `Status: ${pct}%`;
  right.appendChild(p2);

  const resetBtn = document.createElement("button");
  resetBtn.className = "btn";
  resetBtn.type = "button";
  resetBtn.textContent = "Fortschritt für dieses Thema zurücksetzen";
  resetBtn.style.marginTop = "10px";
  resetBtn.onclick = () => {
    for(let i=0;i<steps.length;i++){
      delete doneState[topicKey + "::" + i];
    }
    saveDone();
    render();
  };
  right.appendChild(resetBtn);

  layout.appendChild(left);
  layout.appendChild(right);
  appEl.appendChild(layout);
}

/* ---------- Search (Start only) ---------- */
let searchBound = false;
function bindSearch(){
  if(searchBound) return;
  searchBound = true;

  searchInputEl.addEventListener("input", () => {
    const q = nlow(searchInputEl.value);
    const resEl = document.getElementById("results");
    if(!resEl) return;

    if(!q){
      resEl.style.display = "none";
      resEl.innerHTML = "";
      return;
    }

    const hits = topics.filter(t => {
      const hay = [t.category, t.subcategory, t.title, t.content, ...(t.steps || [])].join(" ").toLowerCase();
      return hay.includes(q);
    }).slice(0, 20);

    resEl.innerHTML = "";
    resEl.style.display = "flex";

    hits.forEach(t => {
      const item = document.createElement("div");
      item.className = "resultItem";

      const tt = document.createElement("p");
      tt.className = "rTitle";
      tt.textContent = `${emojiFor("topic", t.title, t.subcategory, t.category)}  ${t.title || "Treffer"}`;

      const m = document.createElement("p");
      m.className = "rMeta";
      m.textContent = `${t.category}${t.subcategory ? " › " + t.subcategory : ""} › ${t.title}`;

      item.appendChild(tt);
      item.appendChild(m);

      item.onclick = () => {
        state.level = "topic";
        state.category = t.category;
        state.subcategory = t.subcategory;
        state.topicId = t.id;
        render();
      };

      resEl.appendChild(item);
    });

    if(!hits.length){
      const none = document.createElement("div");
      none.className = "resultItem";
      none.textContent = "Keine Treffer.";
      resEl.appendChild(none);
    }
  });
}

/* ---------- Main render ---------- */
function render(){
  setNav();

  backBtn.onclick = () => {
    if(state.level === "topic"){
      state.level = "topics";
      state.topicId = null;
    } else if(state.level === "topics"){
      state.level = "sub";
      state.subcategory = null;
    } else if(state.level === "sub"){
      state.level = "start";
      state.category = null;
    }
    render();
  };

  if(state.level === "start") renderStart();
  else if(state.level === "sub") renderSubcategories();
  else if(state.level === "topics") renderTopics();
  else if(state.level === "topic") renderTopic();
}

/* ---------- Boot ---------- */
(async function init(){
  try{
    const raw = await loadCSV(CSV_URL);

    topics = raw
      .filter(r => isActive(r["aktiv"]))
      .map((r) => {
        const category = norm(r["kategorie"]);
        const subcategory = norm(r["unterkategorie"]);
        const title = norm(r["titel"]);
        const content = norm(r["inhalt"]);

        const catOrder = Number(norm(r["kategorie_reihenfolge"]) || 9999);
        const subOrder = Number(norm(r["reihenfolge"]) || 9999);

        const steps = [];
        for(let i=1;i<=20;i++){
          const v = norm(r["schritt" + i]);
          if(v) steps.push(v);
        }

        const id = [nlow(category), nlow(subcategory), nlow(title)].join("||");
        return { id, category, subcategory, title, content, steps, catOrder, subOrder };
      })
      .filter(t => t.category && t.subcategory && t.title);

    render();
  }catch(err){
    appEl.innerHTML = "";
    const box = document.createElement("div");
    box.className = "panel";
    box.innerHTML = `
      <h3>Fehler beim Laden</h3>
      <p>${(err && err.message) ? err.message : "Unbekannter Fehler"}</p>
      <p>Prüfe bitte, ob die CSV-URL öffentlich abrufbar ist (publish) und ob die Header exakt stimmen.</p>
    `;
    appEl.appendChild(box);
    searchRowEl.style.display = "none";
    navlineEl.style.display = "none";
  }
})();
</script>
