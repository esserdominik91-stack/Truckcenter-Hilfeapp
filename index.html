<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <title>Truckcenter Hilfecenter</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    :root {
      --bg: #020617;
      --bg-elevated: #020617;
      --bg-card: #020617;
      --border-subtle: #1f2937;
      --border-strong: #38bdf8;
      --accent: #38bdf8;
      --accent-soft: rgba(56,189,248,.1);
      --text: #e5e7eb;
      --text-muted: #9ca3af;
      --danger: #f97373;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
      background: radial-gradient(circle at top, #111827 0, #020617 45%, #000 100%);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      padding: 16px;
    }

    .shell {
      width: 100%;
      max-width: 1100px;
      background: rgba(15,23,42,.98);
      border-radius: 18px;
      border: 1px solid rgba(148,163,184,.25);
      box-shadow:
        0 20px 45px rgba(0,0,0,.75),
        0 0 0 1px rgba(15,23,42,.9);
      padding: 16px 18px 20px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    header {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      border-bottom: 1px solid var(--border-subtle);
      padding-bottom: 10px;
    }

    header .title-block {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    header h1 {
      margin: 0;
      font-size: 1.1rem;
      letter-spacing: .05em;
      text-transform: uppercase;
    }

    header .subtitle {
      font-size: .8rem;
      color: var(--text-muted);
    }

    .badge {
      font-size: .7rem;
      padding: 4px 8px;
      border-radius: 999px;
      border: 1px solid rgba(56,189,248,.3);
      background: radial-gradient(circle at top left, rgba(56,189,248,.25), rgba(15,23,42,1) 60%);
      color: var(--accent);
      text-transform: uppercase;
      letter-spacing: .05em;
      white-space: nowrap;
    }

    .topbar {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .search-wrapper {
      position: relative;
    }

    #searchInput {
      width: 100%;
      padding: 10px 12px 10px 32px;
      border-radius: 999px;
      border: 1px solid var(--border-subtle);
      background: #020617;
      color: var(--text);
      font-size: .9rem;
      outline: none;
    }

    #searchInput::placeholder {
      color: var(--text-muted);
    }

    .search-icon {
      position: absolute;
      left: 10px;
      top: 50%;
      transform: translateY(-50%);
      font-size: .9rem;
      color: var(--text-muted);
      pointer-events: none;
    }

    #searchResults {
      margin-top: 6px;
      background: var(--bg-card);
      border-radius: 10px;
      border: 1px solid var(--border-subtle);
      display: none;
      max-height: 260px;
      overflow-y: auto;
      font-size: .85rem;
    }

    .searchResult {
      padding: 8px 10px;
      cursor: pointer;
      border-bottom: 1px solid rgba(15,23,42,1);
    }

    .searchResult:last-child {
      border-bottom: none;
    }

    .searchResult:hover {
      background: rgba(15,23,42,1);
    }

    .searchResult span.k {
      color: var(--text-muted);
    }

    .searchResult span.t {
      color: var(--accent);
    }

    .layout {
      display: grid;
      grid-template-columns: minmax(0, 260px) minmax(0, 1fr);
      gap: 14px;
      margin-top: 2px;
    }

    @media (max-width: 800px) {
      .layout {
        grid-template-columns: minmax(0, 1fr);
      }
    }

    .sidebar {
      background: var(--bg-card);
      border-radius: 12px;
      border: 1px solid var(--border-subtle);
      padding: 10px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .sidebar-title {
      font-size: .8rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: .08em;
      color: var(--text-muted);
      margin-bottom: 4px;
    }

    .category-btn {
      width: 100%;
      text-align: left;
      padding: 8px 9px;
      border-radius: 8px;
      border: 1px solid transparent;
      background: transparent;
      color: var(--text);
      font-size: .9rem;
      cursor: pointer;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 6px;
    }

    .category-btn span.label {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .category-btn span.count {
      font-size: .7rem;
      color: var(--text-muted);
    }

    .category-btn:hover {
      background: rgba(15,23,42,1);
      border-color: var(--border-subtle);
    }

    .category-btn.active {
      background: var(--accent-soft);
      border-color: var(--border-strong);
      color: var(--accent);
    }

    .main {
      background: var(--bg-card);
      border-radius: 12px;
      border: 1px solid var(--border-subtle);
      padding: 12px 12px 14px;
      min-height: 220px;
    }

    .main h2 {
      margin: 0 0 8px;
      font-size: 1rem;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .breadcrumb {
      font-size: .78rem;
      color: var(--text-muted);
      margin-bottom: 6px;
    }

    .breadcrumb button {
      border: none;
      background: none;
      color: var(--accent);
      cursor: pointer;
      padding: 0;
      font-size: inherit;
    }

    .breadcrumb span.sep {
      margin: 0 4px;
      color: var(--text-muted);
    }

    .topicIntro {
      font-size: .9rem;
      color: var(--text-muted);
      background: rgba(15,23,42,1);
      border-radius: 8px;
      padding: 8px 9px;
      margin-bottom: 10px;
      border: 1px dashed var(--border-subtle);
    }

    .topic-list {
      display: flex;
      flex-direction: column;
      gap: 6px;
      margin-top: 4px;
    }

    .topic-btn {
      width: 100%;
      text-align: left;
      padding: 8px 9px;
      border-radius: 8px;
      border: 1px solid var(--border-subtle);
      background: rgba(15,23,42,1);
      color: var(--text);
      font-size: .9rem;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .topic-btn.highlight {
      border-color: var(--border-strong);
      box-shadow: 0 0 0 1px rgba(56,189,248,.4);
    }

    .topic-btn .t-title {
      font-weight: 500;
    }

    .topic-btn .t-sub {
      font-size: .76rem;
      color: var(--text-muted);
    }

    .steps {
      display: flex;
      flex-direction: column;
      gap: 6px;
      margin-top: 8px;
    }

    .step {
      border-radius: 8px;
      background: rgba(15,23,42,1);
      border: 1px solid var(--border-subtle);
      padding: 7px 9px;
      font-size: .9rem;
    }

    .stepRow {
      display: flex;
      align-items: flex-start;
      gap: 8px;
    }

    .stepRow input[type="checkbox"] {
      margin-top: 3px;
      cursor: pointer;
    }

    .stepRow span.txt {
      display: inline-block;
      white-space: pre-wrap;
    }

    .stepRow span.txt.done {
      text-decoration: line-through;
      color: var(--text-muted);
    }

    .empty-hint {
      font-size: .85rem;
      color: var(--text-muted);
      padding: 6px 2px;
    }
  </style>
</head>
<body>
  <div class="shell">
    <header>
      <div class="title-block">
        <h1>Truckcenter Hilfecenter</h1>
        <div class="subtitle">Interne Hilfe · Anleitungen · Prozess-Schritte</div>
      </div>
      <div class="badge">Sheet-gestützt · Live</div>
    </header>

    <div class="topbar">
      <div class="search-wrapper">
        <span class="search-icon">🔍</span>
        <input id="searchInput" type="text" placeholder="Suche nach Kategorie, Thema oder Schritt …">
      </div>
      <div id="searchResults"></div>
    </div>

    <div class="layout">
      <aside class="sidebar">
        <div class="sidebar-title">Kategorien</div>
        <div id="categoryList"></div>
      </aside>

      <main class="main">
        <div id="app">
          <div class="empty-hint">
            Wähle links eine Kategorie oder nutze die Suche, um eine Anleitung zu öffnen.
          </div>
        </div>
      </main>
    </div>
  </div>

  <script src="js/app.js"></script>
</body>
</html>
